datasets:
  synth:
    sizes: [ "full" ]

  smartbench:
    sizes: [ "xsmall"]

  mimic:
    sizes: [ "x1692200" ]

# AsterixDB of STGraph: host and port of the cluster controller (CC, query API), addresses of the node controllers
# (NC, which receive the data feeds)
setups:
  c0:
    host: localhost
    port: 19002
    controllerIPs: [ "localhost" ]
  # Scale-out on an AsterixDB cluster deployed beforehand (see evaluation/README.md)
  # c1:
  #   host: 192.168.1.10
  #   port: 19002
  #   controllerIPs: [ "192.168.1.11", "192.168.1.12" ]

defaults:
  modes: [ "OPTIMIZED" ]
  setups: [ "c0" ]
  threads: [ 1 ]

runs:
  - approaches: [ "stgraph" ]
    datasets: [ "mimic" ]
    modes: [ "OPTIMIZED" ]

ingestion:
  enabled: true
  datasets: [ "synth", "smartbench", "mimic" ]
  setups: [ "c0" ]
  threads: [ 1 ]

# The evaluation of STGraph and of its competitors (./gradlew evaluate, see evaluation/README.md); not used by the tests
evaluation:
  # stgraph (reference loader and queries), stgraph-std (ingestion only, through the shared loader skeleton),
  # neo4j, pgage, graphix, aeong, hygraph: one at a time, in this order
  systems: [ "stgraph", "neo4j", "pgage", "graphix" ]
  # The sizes are the ones of datasets.<dataset>.sizes
  datasets: [ "smartbench" ]
  # Setups, threads and query modes of STGraph; the competitors run single-threaded, in OPTIMIZED mode.
  # A local setup (host: localhost) runs on the AsterixDB of docker-compose.yaml; a cluster must be already running
  setups: [ "c0" ]
  threads: [ 1 ]
  modes: [ "OPTIMIZED" ]
  ingestion:
    iterations: 1
  queries:
    iterations: 10
    # Selectivities of time_constraints.yaml: each query runs on every time window of each one
    selectivities: [ "increased" ]
    # Query ids (empty: all)
    ids: [ ]
  # Downloads the missing datasets with downloadDataset.sh (needs bash and wget)
  download: true
  # Starts each system (docker compose up -d) before its runs and stops it after; false: the systems are already running
  deploy: true