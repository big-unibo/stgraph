datasets:
#  synth:
#    sizes: [ "full" ]
  smartbench:
    sizes: [ "xsmall"]

  mimic:
    sizes: [ "x1692200" ]
    # PostgreSQL the ingestion reads the MIMIC-IV data from (here, the mimic-postgres of docker-compose.yaml)
    postgres_endpoint: "localhost"
    port: 5434
    database: "mimic-iv"
    user: "postgres"
    password: "password"

# AsterixDB of STGraph: host and port of the cluster controller (CC, query API), addresses of the node controllers
# (NC, which receive the data feeds)
setups:
  c0:
    host: localhost
    port: 19002
    controllerIPs: [ "localhost" ]
  # Scale-out on an AsterixDB cluster deployed beforehand (see evaluation/README.md)
  # c1:
  #   host: 192.168.1.10
  #   port: 19002
  #   controllerIPs: [ "192.168.1.11", "192.168.1.12" ]

# Where the systems started by the evaluation (deploy: true) keep their data: a folder on the host for each one
# (relative paths: from the repository root; created if missing), e.g. on a disk with room for the large sizes.
# {size} stands for the size of the run (e.g., neo4j: /data/neo4j/{size}): a folder per size, so that Neo4j and PGAge,
# which keep a single database, can be queried on every size without reloading it.
# Without a folder, the Docker volume of the system. The folder of pgage must be writable by the user 1000 (postgres
# in its container). Empty the folder of asterixdb or graphix when the partitions of its cc.conf change (or use a
# folder per partitioning)
volumes:
  asterixdb:   # the AsterixDB of STGraph (docker-compose.yaml of the repository root)
  graphix:
  neo4j:
  pgage:

# Parameters common to the specific runs and to the evaluation: each run, and the evaluation, can set its own
defaults:
  # Query modes, setups and threads of STGraph; the competitors run single-threaded, in OPTIMIZED mode.
  # A local setup (host: localhost) runs on the AsterixDB of docker-compose.yaml; a cluster must be already running
  modes: [ "OPTIMIZED" ]
  setups: [ "c0" ]
  threads: [ 1 ]
  # The rest is used only by the evaluation (./gradlew evaluate, ./gradlew evaluateSpecificRuns), not by the tests
  ingestion:
    iterations: 1
  queries:
    iterations: 10
    # Selectivities of time_constraints.yaml: each query runs on every time window of each one
    selectivities: [ "increased" ]
    # Query ids (empty: all)
    ids: [ ]
  # Downloads the missing datasets (from the same URLs as downloadDataset.sh)
  download: true
  # Starts each system (docker compose up -d) before its runs and stops it after; false: the systems are already running
  deploy: true
  # Appended to the model of the results (e.g., 4CPU: stgraph_4CPU, neo4j_4CPU): the configuration the runs measure
  # (CPU, memory, partitions...), to tell its results apart; empty: the bare model
  label:

# Only the listed runs: the tests of STGraph (CI) run the ones with stgraph among the approaches, ./gradlew
# evaluateSpecificRuns runs all of them. Each run sets approaches (stgraph, stgraph-std, neo4j, pgage, graphix, aeong,
# hygraph) and datasets, optionally sizes (default: datasets.<dataset>.sizes) and any key of the defaults
specificRuns:
  runs:
    - approaches: [ "stgraph" ]
      datasets: [ "smartbench", "mimic" ]
      modes: [ "OPTIMIZED" ]

# Every combination of its parameters (./gradlew evaluate, see evaluation/README.md); not used by the tests. It sets
# systems (one at a time, in this order) and datasets, optionally sizes and any key of the defaults
evaluation:
  systems: [ "stgraph", "neo4j", "pgage", "graphix" ]
  datasets: [ "smartbench" ]
