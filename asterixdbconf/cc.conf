; AsterixDB (time-series store of STGraph): one node controller with one I/O device, i.e. one data partition,
; for the single-core comparison with the other systems (see PARALLELISM.md).
; The sample-cluster script also starts the service of a second node ("blue"): the cluster does not use it,
; since it is not declared here.

[nc/asterix_nc1]
txn.log.dir=data/red/txnlog
core.dump.dir=data/red/coredump
iodevices=data/red
nc.api.port=19004

[nc]
address=127.0.0.1
command=asterixnc

[cc]
address = 127.0.0.1

[common]
log.dir = logs/
log.level = INFO
