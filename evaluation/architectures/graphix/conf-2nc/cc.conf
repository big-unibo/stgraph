; Graphix, limited configuration with two nodes: the configuration of the AsterixDB of STGraph
; (evaluation/architectures/stgraph/conf-2nc/cc.conf), with the least parallelism of conf/ on the two nodes with one
; partition each of the image, plus the Graphix extensions and the evaluation strategies of conf/: keep them aligned.
; The same partitions as conf-free-2nc, so its data are readable here. The data loaded with another partitioning
; (conf/, conf-free) are not: another data folder (see the volumes section of test_config.yml).
; Heap: by default each node takes 60% of the memory it sees, so the two nodes together may exceed it under load. To
; limit them, uncomment jvm.args in [nc] with 30% of the memory.

[nc/asterix_nc1]
txn.log.dir=data/red/txnlog
core.dump.dir=data/red/coredump
iodevices=data/red
nc.api.port=19004

[nc/asterix_nc2]
ncservice.port=9091
txn.log.dir=data/blue/txnlog
core.dump.dir=data/blue/coredump
iodevices=data/blue
nc.api.port=19005

[nc]
address=127.0.0.1
command=asterixnc
;jvm.args=-Xmx<30% of the memory>
; One I/O worker per partition (default 2)
io.workers.per.partition=1
; One flush and one merge of LSM components at a time per partition (default 2)
storage.max.concurrent.flushes.per.partition=1
storage.max.concurrent.merges.per.partition=1

[cc]
address = 127.0.0.1

[common]
log.dir = logs/
log.level = INFO
; Degree of parallelism of the queries (default 0: one per data partition)
compiler.parallelism=1
; No parallel sort (default true)
compiler.sort.parallel=false

[extension/org.apache.asterix.graphix.extension.GraphixQueryTranslatorExtension]
graphix.semantics.pattern=isomorphism
graphix.semantics.navigation=no-repeat-anything
; No join between an edge and a vertex defined on the same records (default false): e.g., an event is read once, as
; the edge hasTS and as the vertex TemperatureEvent, instead of twice and joined on (tsid, _id)
graphix.evaluation.minimize-joins=true
; Index nested-loop joins between vertices and edges, on the keys with an index (default false: hash joins on scans):
; e.g., from a time series to its events through the primary key (tsid, _id) of Observations. Applied to every such
; join, whatever its cost (the optimizer of Graphix has no CBO)
graphix.evaluation.prefer-indexnl=true

; Dummy keys: these sections only need to exist
[extension/org.apache.asterix.graphix.extension.GraphixLangExtension]
enabled=true
[extension/org.apache.asterix.graphix.extension.GraphixMetadataExtension]
enabled=true
