; Graphix on a cluster of Docker Swarm, for the scale-out (scaleOut: true in test_config.yml, see evaluation/README.md): the
; free configuration (conf-free/cc.conf, keep them aligned) with one node controller per machine of the setup, each
; with two data partitions, as the node of conf-free, as the AsterixDB of STGraph
; (evaluation/architectures/stgraph/conf-scaleout/cc.conf). Not used as it is: the evaluation writes the node
; controllers (one [nc/ncN] section per address of controllerIPs) and the address of the cluster controller (host)
; from the setup of the run.
; No data folder: the data stay in the containers, removed with the stack.

{nodes}
[nc]
command=asterixnc

[cc]
address = {cc}

[common]
log.dir = logs/
log.level = INFO

[extension/org.apache.asterix.graphix.extension.GraphixQueryTranslatorExtension]
graphix.semantics.pattern=isomorphism
graphix.semantics.navigation=no-repeat-anything
graphix.evaluation.minimize-joins=true
graphix.evaluation.prefer-indexnl=true

; Dummy keys: these sections only need to exist
[extension/org.apache.asterix.graphix.extension.GraphixLangExtension]
enabled=true
[extension/org.apache.asterix.graphix.extension.GraphixMetadataExtension]
enabled=true
