; Graphix, free configuration with two nodes: conf-free (no limit on parallelism or memory), with the two nodes with one
; partition each of the image (start-sample-cluster.sh) instead of one node with two partitions, as the AsterixDB of
; STGraph (evaluation/architectures/stgraph/conf-free-2nc/cc.conf): keep them aligned.
; Plus the Graphix extensions, as conf-free: the semantics of the queries, the optional evaluation strategies of
; Graphix (minimize-joins, prefer-indexnl) at their defaults.
; The same nodes as conf-3cpu-12g, so its data are readable here. The data loaded with another partitioning (conf/,
; conf-free) are not: another data folder (see the volumes section of test_config.yml).
; Heap: by default each node takes 60% of the memory it sees, here the whole machine, so the two nodes together may
; exceed it under load. To limit them, as conf-3cpu-12g, uncomment jvm.args in [nc] with 30% of the memory of the machine.

[nc/asterix_nc1]
txn.log.dir=data/red/txnlog
core.dump.dir=data/red/coredump
iodevices=data/red
nc.api.port=19004

[nc/asterix_nc2]
ncservice.port=9091
txn.log.dir=data/blue/txnlog
core.dump.dir=data/blue/coredump
iodevices=data/blue
nc.api.port=19005

[nc]
address=127.0.0.1
command=asterixnc
;jvm.args=-Xmx<30% of the memory>

[cc]
address = 127.0.0.1

[common]
log.dir = logs/
log.level = INFO

[extension/org.apache.asterix.graphix.extension.GraphixQueryTranslatorExtension]
graphix.semantics.pattern=isomorphism
graphix.semantics.navigation=no-repeat-anything

; Dummy keys: these sections only need to exist
[extension/org.apache.asterix.graphix.extension.GraphixLangExtension]
enabled=true
[extension/org.apache.asterix.graphix.extension.GraphixMetadataExtension]
enabled=true
