; Graphix in the budget of 3 CPUs and 12 GB (see evaluation/README.md), all for its AsterixDB. The configuration of
; the image (start-sample-cluster.sh): two nodes, one partition each, as the AsterixDB of STGraph, the default
; parallelism (one per partition). Only the heap of the nodes is set: by default each node takes 60% of the memory it
; sees, i.e., of the container, and the two nodes would together exceed it; each one takes half of that, 30% of
; 12 GB. Plus the Graphix extensions, with minimize-joins only (prefer-indexnl at its default, false).

[nc/asterix_nc1]
txn.log.dir=data/red/txnlog
core.dump.dir=data/red/coredump
iodevices=data/red
nc.api.port=19004

[nc/asterix_nc2]
ncservice.port=9091
txn.log.dir=data/blue/txnlog
core.dump.dir=data/blue/coredump
iodevices=data/blue
nc.api.port=19005

[nc]
address=127.0.0.1
command=asterixnc
jvm.args=-Xmx3686m

[cc]
address = 127.0.0.1

[common]
log.dir = logs/
log.level = INFO

[extension/org.apache.asterix.graphix.extension.GraphixQueryTranslatorExtension]
graphix.semantics.pattern=isomorphism
graphix.semantics.navigation=no-repeat-anything
; No join between an edge and a vertex defined on the same records (default false): e.g., an event is read once, as
; the edge hasTS and as the vertex TemperatureEvent, instead of twice and joined on (tsid, _id)
graphix.evaluation.minimize-joins=true

; Dummy keys: these sections only need to exist
[extension/org.apache.asterix.graphix.extension.GraphixLangExtension]
enabled=true
[extension/org.apache.asterix.graphix.extension.GraphixMetadataExtension]
enabled=true
