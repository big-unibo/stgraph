# Graphix on Docker Swarm, for the scale-out (./gradlew evaluateScaleOut, see evaluation/README.md): as the AsterixDB
# of STGraph (evaluation/architectures/stgraph/docker-stack.yaml, keep them aligned), with the image of Graphix (its
# package, from its Dockerfile, published on a registry that every node can reach) and conf-scaleout/cc.conf of
# Graphix. The cluster controller on the node of the host of the setup, a node controller on the node of each address
# of its controllerIPs, one per machine, up to four (nc1-nc4; the unused ones have 0 replicas). Host network: the
# cluster listens on the addresses of the machines, those of the setup, used by the queries and the data feed. No
# persistence: the data stay in the containers, removed with the stack.
x-node: &node
  image: ${GRAPHIX_IMAGE:-bigunibo/graphix:0.4.1}
  networks: [ hostnet ]

x-nc: &nc
  <<: *node
  command: [ "bin/asterixncservice", "-logdir", "-" ]

services:
  cc:
    <<: *node
    command: [ "bin/asterixcc", "-config-file", "/asterixsetup/cc.conf" ]
    configs:
      - source: cc
        target: /asterixsetup/cc.conf
    deploy:
      placement: { constraints: [ "node.hostname == ${CC_NODE}" ] }
      restart_policy: { condition: none }
  nc1:
    <<: *nc
    deploy:
      replicas: ${NC1_REPLICAS:-0}
      placement: { constraints: [ "node.hostname == ${NC1_NODE:-none}" ] }
      restart_policy: { condition: none }
  nc2:
    <<: *nc
    deploy:
      replicas: ${NC2_REPLICAS:-0}
      placement: { constraints: [ "node.hostname == ${NC2_NODE:-none}" ] }
      restart_policy: { condition: none }
  nc3:
    <<: *nc
    deploy:
      replicas: ${NC3_REPLICAS:-0}
      placement: { constraints: [ "node.hostname == ${NC3_NODE:-none}" ] }
      restart_policy: { condition: none }
  nc4:
    <<: *nc
    deploy:
      replicas: ${NC4_REPLICAS:-0}
      placement: { constraints: [ "node.hostname == ${NC4_NODE:-none}" ] }
      restart_policy: { condition: none }

networks:
  hostnet:
    external: true
    name: host

configs:
  # A new name for each content (CC_CONF_NAME): a config of Swarm cannot change
  cc:
    name: ${CC_CONF_NAME}
    file: ${CC_CONF}
