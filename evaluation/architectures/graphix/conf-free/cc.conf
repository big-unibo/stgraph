; Graphix, free configuration (see evaluation/README.md): the configuration of the image (start-sample-cluster.sh),
; with no limit on parallelism or memory, as one node with two data partitions instead of the two nodes with one
; partition each of the image, as the free configuration of the AsterixDB of STGraph
; (evaluation/architectures/stgraph/conf-free/cc.conf): keep them aligned. The sample-cluster script also starts the
; service of the second node ("blue"): the cluster does not use it, since it is not declared here.
; Plus the Graphix extensions, without which the Graphix language is not available, with the semantics of the patterns
; of the queries, and the evaluation strategies of conf/ (minimize-joins, prefer-indexnl): without them, Graphix ignores
; the primary key of the events and scans them all at every query, so the two configurations differ only in parallelism.
; The data loaded with another partitioning (e.g., conf/, one partition) are not readable: another data folder (see
; the volumes section of test_config.yml).

[nc/asterix_nc1]
txn.log.dir=data/red/txnlog
core.dump.dir=data/red/coredump
; Two I/O devices: two data partitions
iodevices=data/io0,data/io1
nc.api.port=19004

[nc]
address=127.0.0.1
command=asterixnc

[cc]
address = 127.0.0.1

[common]
log.dir = logs/
log.level = INFO

[extension/org.apache.asterix.graphix.extension.GraphixQueryTranslatorExtension]
graphix.semantics.pattern=isomorphism
graphix.semantics.navigation=no-repeat-anything
; As conf/: no join between an edge and a vertex defined on the same records (default false): e.g., an event is read
; once, as the edge hasTS and as the vertex TemperatureEvent, instead of twice and joined on (tsid, _id)
graphix.evaluation.minimize-joins=true
; As conf/: index nested-loop joins between vertices and edges, on the keys with an index (default false: hash joins on
; scans): e.g., from a time series to its events through the primary key (tsid, _id) of Observations
graphix.evaluation.prefer-indexnl=true

; Dummy keys: these sections only need to exist
[extension/org.apache.asterix.graphix.extension.GraphixLangExtension]
enabled=true
[extension/org.apache.asterix.graphix.extension.GraphixMetadataExtension]
enabled=true
