services:
  hygraph:
    build: .
    image: mp4sini/hygraph:latest
    hostname: hygraph
    container_name: hygraph
    # Single-core comparison with the other systems (see evaluation/README.md); the client runs in this container too
    cpus: 1
    # Set by the evaluation (src/test/kotlin/it/unibo/tests/evaluation, SmartBenchEvaluation)
    environment:
      - DATASET
      - DATASET_SIZE
      - INGESTION_ITERATIONS
      - QUERY_ITERATIONS
      - THREAD
      - QUERY_SELECTIVITY
      - QUERIES
    volumes:
      - "../../../results/hygraph:/hygraph/results/hygraph"
      - "./time_constraints_tstamp.yaml:/cons/time_constraints.yaml"
    command:
      - /bin/bash
      - -c
      - |
        cp /cons/time_constraints.yaml /hygraph/resources
        chmod +x scripts/run_evaluation.sh.sh
        chmod +x scripts/download_dataset.sh
        ./scripts/run_evaluation.sh