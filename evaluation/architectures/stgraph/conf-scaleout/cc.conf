; The AsterixDB of STGraph on a cluster of Docker Swarm, for the scale-out (scaleOut: true in test_config.yml, see
; evaluation/README.md): the free configuration (conf-free/cc.conf, keep them aligned) with one node controller per
; machine of the setup, each with two data partitions, as the node of conf-free. Not used as it is: the evaluation
; writes the node controllers (one [nc/ncN] section per address of controllerIPs) and the address of the cluster
; controller (host) from the setup of the run.
; No data folder: the data stay in the containers, removed with the stack.

{nodes}
[nc]
command=asterixnc

[cc]
address = {cc}

[common]
log.dir = logs/
log.level = INFO
