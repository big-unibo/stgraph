; The AsterixDB of STGraph in the budget of 3 CPUs and 12 GB (see evaluation/README.md): 2 CPUs and 9 GB for AsterixDB,
; the third CPU and 3 GB for the JVM of STGraph. The configuration of the image (start-sample-cluster.sh): two nodes,
; one partition each, the default parallelism (one per partition). Only the heap of the nodes is set: by default
; each node takes 60% of the memory it sees, i.e., of the container, and the two nodes would together exceed it;
; each one takes half of that, 30% of 9 GB.

[nc/asterix_nc1]
txn.log.dir=data/red/txnlog
core.dump.dir=data/red/coredump
iodevices=data/red
nc.api.port=19004

[nc/asterix_nc2]
ncservice.port=9091
txn.log.dir=data/blue/txnlog
core.dump.dir=data/blue/coredump
iodevices=data/blue
nc.api.port=19005

[nc]
address=127.0.0.1
command=asterixnc
jvm.args=-Xmx2765m

[cc]
address = 127.0.0.1

[common]
log.dir = logs/
log.level = INFO
