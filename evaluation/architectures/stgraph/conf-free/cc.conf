; The AsterixDB of STGraph, free configuration (see evaluation/README.md): the configuration of the image
; (start-sample-cluster.sh), with no limit on parallelism or memory, as one node with two data partitions instead of
; the two nodes with one partition each of the image: the same parallelism (one per partition), in one JVM, without
; exchanges between two nodes on localhost and with one heap and buffer cache (by default a share of the memory of the
; container) instead of two. The sample-cluster script also starts the service of the second node ("blue"): the
; cluster does not use it, since it is not declared here.
; The data loaded with another partitioning (e.g., conf/, one partition) are not readable: another data folder (see
; the volumes section of test_config.yml).

[nc/asterix_nc1]
txn.log.dir=data/red/txnlog
core.dump.dir=data/red/coredump
; Two I/O devices: two data partitions
iodevices=data/io0,data/io1
nc.api.port=19004

[nc]
address=127.0.0.1
command=asterixnc

[cc]
address = 127.0.0.1

[common]
log.dir = logs/
log.level = INFO
