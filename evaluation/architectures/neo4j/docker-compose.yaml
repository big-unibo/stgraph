# Neo4j for the SmartBench evaluation. The database only: ingestion and queries run from the evaluation
# (./gradlew evaluate, see evaluation/README.md), which also starts and stops it.
services:
  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    hostname: neo4j
    # Single-core comparison with the other systems (see evaluation/README.md). NEO4J_CPUS, NEO4J_CPUSET (the cores),
    # NEO4J_MEMORY and NEO4J_CONF (the folder of neo4j.conf): other resources and configuration (set by the evaluation
    # from the resources section of test_config.yml)
    cpus: ${NEO4J_CPUS:-1}
    cpuset: "${NEO4J_CPUSET:-}"
    mem_limit: ${NEO4J_MEMORY:-0}
    environment:
      - NEO4J_AUTH=none
    volumes:
      # The files in /conf override the configuration of the image
      - "${NEO4J_CONF:-./conf}:/conf"
      # Data of Neo4j, kept when the container is recreated; NEO4J_DATA: a host directory instead of the Docker volume
      # (set by the evaluation from the volumes section of test_config.yml)
      - "${NEO4J_DATA:-neo4j-data}:/data"
    ports:
      - 7474:7474
      - 7687:7687

volumes:
  neo4j-data:
