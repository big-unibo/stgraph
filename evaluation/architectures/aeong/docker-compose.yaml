services:
  aeong:
    build: .
    image: mp4sini/aeong:latest
    hostname: aeong
    container_name: aeong
    env_file:
      - ../../.env
    volumes:
      - ../../data/aeong:/home/AeonG/tests/results/aeong/
      - ./time_constraints_commit.yaml:/vol/time_constraints.yaml
      - ./queries:/home/AeonG/tests/results/temporal_query
      - ./datasets:/home/AeonG/tests/datasets/T-mgBench/
    command:
      - /bin/bash
      - -c
      - |
        cp /vol/time_constraints.yaml /home/AeonG/tests/experiments/
        ./t_smarbench_test.sh
