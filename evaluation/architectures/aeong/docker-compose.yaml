services:
  aeong:
    image: mp4sini/aeong:latest
    hostname: aeong
    container_name: aeong
    # No CPU or memory limit by default (free), as the other systems; AEONG_CPUS, AEONG_CPUSET (the cores) and
    # AEONG_MEMORY: the resources of a run (set by the evaluation from the resources section of test_config.yml). The
    # client runs in this container too
    cpus: ${AEONG_CPUS:-0}
    cpuset: "${AEONG_CPUSET:-}"
    mem_limit: ${AEONG_MEMORY:-0}
    # Set by the evaluation (src/test/kotlin/it/unibo/tests/evaluation, SmartBenchEvaluation)
    environment:
      - DATASET
      - DATASET_SIZE
      - INGESTION_ITERATIONS
      - QUERY_ITERATIONS
      - THREAD
      - QUERY_SELECTIVITY
      - QUERIES
      # serve: no ingestion nor queries, AeonG serves the loaded database (Bolt, AEONG_PORT on the host) until stopped, to
      # measure its transaction times (see AeonGTransactionTimes)
      - AEONG_MODE
    ports:
      - "${AEONG_PORT:-7690}:7687"
    volumes:
      - ../../../results/aeong:/home/AeonG/tests/results/aeong/
      # AEONG_QUERIES: the query files of the dataset (those of src/test/resources/queries/<dataset>/aeong with the
      # transaction time of the run, written by the evaluation next to the dump). Read-only and copied by the command, as
      # the scripts of the image rewrite them for each time window
      - ${AEONG_QUERIES}:/vol/queries:ro
      # AEONG_DATASETS: the folder of the dump of the dataset on the host (datasets/dump/aeong/<dataset>/<size>, set by the
      # evaluation). Only this folder, not T-mgBench, where the image keeps cypher_index.cypher
      - ${AEONG_DATASETS}:/home/AeonG/tests/datasets/T-mgBench/${DATASET:-smartbench}
      # The database, kept between the ingestion and the queries of two runs; AEONG_DATA: a host directory instead of the
      # Docker volume (set by the evaluation from the volumes section of test_config.yml)
      - ${AEONG_DATA:-aeong-data}:/home/AeonG/tests/results/database
    command:
      - /bin/bash
      - -c
      - |
        LOADED=/home/AeonG/tests/results/database/loaded
        if [ "$$AEONG_MODE" = serve ]; then
          if [ "$$(cat $$LOADED 2>/dev/null)" != "$$DATASET $$DATASET_SIZE updates" ]; then
            echo "The database holds [$$(cat $$LOADED 2>/dev/null)], not [$$DATASET $$DATASET_SIZE updates]: run the ingestion first"
            exit 1
          fi
          # As the scripts of the image start AeonG for the queries (../scripts/evaluate_temporal_q.py)
          exec python3 -c "import sys, time; sys.path.append('../mgbench'); import runners
        m = runners.Memgraph('../../build/memgraph', '../results/database/aeong', True, memgraph_port=7687, snapshot_interval_sec=30, memory_limit=0, anchor_num=10, real_time_flag=False)
        m.start_benchmark(); print('AeonG serving the loaded database', flush=True); time.sleep(10 ** 9)"
        fi
        # The scripts of the image loop over the time windows of time_constraints.yaml for the size: the queries come with
        # their window (SmartBenchEvaluation.aeongQueries), so a single placeholder window per query, run once
        {
          echo "temporalConstraints:"
          echo "  $$QUERY_SELECTIVITY:"
          for Q in EnvironmentCoverage EnvironmentAggregate MaintenanceOwners EnvironmentOutlier AgentOutlier AgentHistory; do
            printf '    %s:\n      %s:\n        0: [ 0, 0 ]\n' "$$Q" "$$DATASET_SIZE"
          done
        } > /home/AeonG/tests/experiments/time_constraints.yaml
        mkdir -p /home/AeonG/tests/results/temporal_query
        cp /vol/queries/*.txt /home/AeonG/tests/results/temporal_query/
        # For the queries without a time window (EnvironmentCoverage, AgentHistory) replace_timestamp.sh of the image
        # writes on the file it reads, which empties it: through a temporary file
        sed -i 's|> "$$OUTPUT_FILE"|> "$$OUTPUT_FILE.tmp" \&\& mv "$$OUTPUT_FILE.tmp" "$$OUTPUT_FILE"|' replace_timestamp.sh
        # postprocess_results.py appends every JSON of query_results to the statistics: only the ones of this run
        STATS=/home/AeonG/tests/results/aeong/query_results/$$DATASET
        [ ! -d "$$STATS" ] || mv "$$STATS" "$$STATS.$$(date +%s)"
        # The database is the one of the last load: a run of the queries only stops if it is not of this dataset and size
        if [ "$$INGESTION_ITERATIONS" -eq 0 ]; then
          if [ "$$(cat $$LOADED 2>/dev/null)" != "$$DATASET $$DATASET_SIZE updates" ]; then
            echo "The database holds [$$(cat $$LOADED 2>/dev/null)], not [$$DATASET $$DATASET_SIZE updates]: run the ingestion first"
            exit 1
          fi
          sed -i '/download_datasets.sh/d' t_smarbench_test.sh
        else
          echo > $$LOADED
        fi
        ./t_smarbench_test.sh
        [ "$$INGESTION_ITERATIONS" -eq 0 ] || echo "$$DATASET $$DATASET_SIZE updates" > $$LOADED

volumes:
  aeong-data:
