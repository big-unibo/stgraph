# PostgreSQL + TimescaleDB + PostGIS + Apache AGE for the SmartBench evaluation. The database only: ingestion and
# queries run from the Kotlin mains of src/test/kotlin/it/unibo/tests/smartbench (TestSmartBenchIngestion.kt,
# TestSmartBenchQuery.kt). conf/postgresql.conf is tuned for the evaluation server (e.g., shared_buffers).
services:
  pgage:
    build: .
    image: mp4sini/pgage:latest
    container_name: pgage
    hostname: pgage
    # Single-core comparison with the other systems (see PARALLELISM.md)
    cpus: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PSW:-psw}
      POSTGRES_DB: ${DB_NAME:-smartbench_eval}
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - ./conf:/pgconf
    command: [ "-c", "config_file=/pgconf/postgresql.conf" ]
    ports:
      - ${POSTGRES_PORT_EXT:-5432}:5432
