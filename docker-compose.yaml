services:
  asterixdb:
    image: mp4sini/asterixdb:latest
    hostname: asterixdb
    container_name: asterixdb
    # No CPU or memory limit by default (free). ASTERIXDB_CPUS, ASTERIXDB_CPUSET (the cores), ASTERIXDB_MEMORY and
    # ASTERIXDB_CONF (the folder of cc.conf): the resources and configuration of a run, e.g. cpus 1 for the single-core
    # comparison of the paper (set by the evaluation from the resources section of test_config.yml, see
    # evaluation/README.md)
    cpus: ${ASTERIXDB_CPUS:-0}
    cpuset: "${ASTERIXDB_CPUSET:-}"
    mem_limit: ${ASTERIXDB_MEMORY:-0}
    command:
      - /bin/bash
      - -c
      - |
        cp /asterixsetup/cc.conf opt/local/conf/cc.conf
        opt/local/bin/start-sample-cluster.sh
        tail -f /dev/null
    volumes:
      - "${ASTERIXDB_CONF:-./evaluation/architectures/stgraph/conf}:/asterixsetup/"
      # Data of AsterixDB (storage and transaction log), kept when the container is recreated; ASTERIXDB_DATA: a host
      # directory instead of the Docker volume (set by the evaluation from the volumes section of test_config.yml).
      # Empty it when the partitions of cc.conf change
      - "${ASTERIXDB_DATA:-asterixdb-data}:/workspace/apache-asterixdb-0.9.9/opt/local/data"
    ports:
      - 19006:19006
      - 19002:19002
      - 19001:19001
      - 19003:19003
      - 10001-11000:10001-11000
      - 1009:1009
      - 1098:1098

  mimic-postgres:
    image: postgres:18
    hostname: postgres
    container_name: mimic-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mimic-iv
    ports:
      - "5434:5432"
    volumes:
      - ./datasets/original/mimic:/dump:ro
      - ./datasets:/docker-entrypoint-initdb.d:ro

volumes:
  asterixdb-data: